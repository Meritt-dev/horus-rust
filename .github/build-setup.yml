# Inserted by dist into every build-local-artifacts job, before `dist build`
# (dist-workspace.toml: github-build-setup). Produces the two inputs a Horus archive needs:
#   - HORUS_VERSION, compiled into the binary (crates/core/src/version.rs), from the tag
#   - crates/cli/horus_source.whl, the source backend wheel pinned to that same version
- name: Stamp HORUS_VERSION from the release tag
  shell: bash
  run: echo "HORUS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
- name: Check out the source backend (Meritt-dev/horus)
  uses: actions/checkout@v6
  with:
    repository: Meritt-dev/horus
    # Meritt-dev/horus is public. Same tag as this release (v0.23.0 → bcdc5f0, the commit npm
    # @merittdev/horus@0.23.0 was published from) unless repo variable HORUS_SOURCE_REF is set.
    ref: ${{ vars.HORUS_SOURCE_REF || github.ref_name }}
    path: _horus-src
- name: Install uv
  uses: astral-sh/setup-uv@v5
- name: Install Node.js
  uses: actions/setup-node@v6
  with:
    node-version: 22
- name: Build horus_source.whl pinned to HORUS_VERSION
  shell: bash
  run: |
    set -euo pipefail
    # One bundle, one version: stamp source-py exactly like horus' release.yml does.
    python3 - "$HORUS_VERSION" _horus-src/packages/source-py <<'PYEOF'
    import re, sys
    version, src = sys.argv[1], sys.argv[2]
    pp = f"{src}/pyproject.toml"
    t = open(pp).read()
    t, n = re.subn(r'^version = "[^"]+"', f'version = "{version}"', t, count=1, flags=re.M)
    assert n == 1
    open(pp, "w").write(t)
    lock = f"{src}/uv.lock"
    t = open(lock).read()
    t, n = re.subn(r'(name = "horus-source"\nversion = ")[^"]+(")', rf'\g<1>{version}\g<2>', t, count=1)
    assert n == 1
    open(lock, "w").write(t)
    PYEOF
    bash _horus-src/scripts/release/build-source-wheel.sh
    cp _horus-src/packages/source-py/dist/horus_source.whl crates/cli/horus_source.whl
    unzip -l crates/cli/horus_source.whl | grep -q "horus_source-${HORUS_VERSION}.dist-info/"
