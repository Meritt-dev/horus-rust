# Custom dist publish job (dist-workspace.toml: publish-jobs = ["./publish-npm"]).
# Turns the release archives into npm packages (release/npm/build.mjs) and publishes them.
# Authenticates with npm trusted publishing (GitHub OIDC, no token). Each package has a trusted
# publisher for Meritt-dev/horus-rust .github/workflows/release.yml (see docs/RELEASE.md).
name: Publish npm packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: Fetch release archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: archives/
          merge-multiple: true
      - name: Build npm packages
        run: |
          VERSION="$(echo "$PLAN" | jq -r '.announcement_tag')"
          node release/npm/build.mjs --archives archives --version "$VERSION" --out npm-out > npm-dirs.txt
          cat npm-dirs.txt
      - name: Publish (platform packages first, launcher last; already-published versions are skipped)
        run: |
          while read -r dir; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm; skipping."
            else
              npm publish "./$dir" --access public
            fi
          done < npm-dirs.txt
