[package]
name = "horus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Local-first, source-aware production-incident investigation engine"
homepage = "https://horus.sh"

[[bin]]
name = "horus-rs"
path = "src/main.rs"

# Release archives: `horus` + the source backend wheel (staged here by the release workflow,
# gitignored). The crate is publish=false, so opt it into dist explicitly.
[package.metadata.dist]
dist = true
include = ["horus_source.whl"]

# `cargo binstall --git <repository> horus-cli` installs the GitHub release archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/horus-cli-{ target }{ archive-suffix }"
bin-dir = "horus-cli-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
horus-core = { workspace = true }
horus-db = { workspace = true }
horus-stitcher = { workspace = true }
horus-connectors = { workspace = true }
horus-engine = { workspace = true }
horus-knowledge = { workspace = true }
horus-ai = { workspace = true }
horus-eval = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
tokio-util = { workspace = true }
hex = { workspace = true }
